<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub activity preview — Omar Hopman</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Preview harness only: gives the component room to breathe on its own page.
       The component's own styles live in style.css under ACTIVITY, so moving it
       onto the About section later means copying markup and adding one script
       tag — nothing here. */
    body { min-height: 100vh; }
    .preview { padding-top: 5rem; padding-bottom: 5rem; }

    /* Shown only when the placeholder snapshot rendered instead of the real
       one, so dummy numbers can never be mistaken for real ones. */
    .activity-notice {
      margin: 0 0 1.25rem;
      padding: 0.6rem 0.85rem;
      border: 1px dashed var(--accent);
      border-radius: 4px;
      color: var(--muted);
      font: 0.78rem/1.5 var(--font-mono);
    }
    .activity-notice[hidden] { display: none; }
  </style>
</head>
<body>
  <main class="wrap preview">
    <section class="activity" aria-label="GitHub contribution activity">
      <p class="activity-notice" hidden>
        Placeholder data — these are not real contributions. Run
        <code>scripts/refresh-activity.sh</code> to write the real
        <code>activity.json</code>, which takes precedence over this file.
      </p>
      <p class="activity-total">
        <strong class="activity-count"></strong>
        <span>contributions this year</span>
      </p>
      <div class="grid-scroll" aria-label="Contribution graph">
        <div class="activity-grid" data-source="activity.json" data-fallback="activity.preview.json"></div>
        <div class="months activity-months" aria-hidden="true"></div>
      </div>
      <div class="activity-bottom">
        <div class="legend" aria-label="Less to more activity">
          <span>Less</span><i class="day"></i><i class="day" data-level="1"></i><i class="day" data-level="2"></i><i class="day" data-level="3"></i><i class="day" data-level="4"></i><span>More</span>
        </div>
      </div>
    </section>
  </main>
  <script src="js/github-activity.js" defer></script>
</body>
</html>
